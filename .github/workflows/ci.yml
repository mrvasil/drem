name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          python3 --version
      - name: Repository and installer checks
        run: make check
      - name: Core and behavior tests
        run: make test
      - name: Release build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Package and verify
        run: |
          make build
          codesign --verify --deep --strict --verbose=2 "dist/drem.app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "dist/drem.app/Contents/Info.plist"
          mkdir -p dist/package
          ditto "dist/drem.app" "dist/package/drem.app"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/package/
          ditto -c -k --sequesterRsrc dist/package "dist/drem-${{ matrix.arch }}.zip"
      - name: Upload test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drem-${{ matrix.arch }}
          path: dist/drem-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
